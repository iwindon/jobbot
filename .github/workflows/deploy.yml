name: Deploy to Azure

on:
  push:
    branches: [main]
    paths:
      - function_app.py
      - host.json
      - requirements.txt
      - jobbot/**
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package
        run: zip -r ../jobbot.zip function_app.py host.json requirements.txt jobbot -x "*__pycache__*"

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy
        run: |
          az functionapp deployment source config-zip \
            -g "${{ vars.AZURE_RESOURCE_GROUP }}" \
            -n "${{ vars.AZURE_FUNCTIONAPP_NAME }}" \
            --src ../jobbot.zip --build-remote true --timeout 600

      - name: Verify functions registered
        run: |
          sleep 30
          out=$(az functionapp function list -g "${{ vars.AZURE_RESOURCE_GROUP }}" -n "${{ vars.AZURE_FUNCTIONAPP_NAME }}" --query "[].name" -o tsv)
          echo "$out"
          echo "$out" | grep -q daily_search
